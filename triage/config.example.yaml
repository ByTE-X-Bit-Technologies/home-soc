# home-soc triage — example configuration
# Copy this file to config.yaml and fill in YOUR network's values.
# Nothing here is real — these are placeholders. The engine reads config.yaml at import time,
# so no network details are ever hardcoded in the code. config.yaml is gitignored.

# --- Your network segments (VLAN labels, for reporting) ---
segments:
  "192.168.10.0/24": "Main"
  "192.168.20.0/24": "Guest"
  "192.168.30.0/24": "IoT"
  # add/rename to match your network

# --- Crown-jewel assets: traffic TOWARD these ELEVATES (possible lateral movement / targeted attack) ---
# Put YOUR critical systems here — SIEM, domain controller, gateway, network controller, etc.
crown_jewels:
  "192.168.10.10": "SIEM / SOC core"
  "192.168.10.11": "domain controller"
  "192.168.10.1":  "gateway"
  "192.168.10.12": "DNS"

# --- Known-benign management sources: infra that legitimately generates heavy internal traffic
#     (a network controller polling gateways, a monitoring host, etc). The engine dismisses what
#     these DO (their outbound management chatter to gateways / the internet) but NEVER what's done
#     TO them — traffic toward a benign source that's also a crown-jewel still elevates. ---
benign_mgmt_sources:
  "192.168.10.20": "network controller — polls gateways/APs (normal management)"

# --- Gateways the benign sources legitimately manage (their polling targets) ---
benign_mgmt_gateways:
  - "192.168.10.1"
  - "192.168.20.1"
  - "192.168.30.1"

# --- Optional: extend the built-in signature classification for your environment ---
# The engine ships sensible defaults for noise / threat / edge-scanner / info signatures.
# Add your own here if your network has noise the defaults don't cover.
# signatures:
#   extra_noise: []            # exact signature strings to auto-dismiss
#   extra_noise_prefixes: []   # signature prefixes to treat as decoder noise
#   extra_threat_markers: []   # substrings that mean "real threat" -> elevate
#   extra_edge_markers: []     # substrings for edge scanners (firewall-dropped)
#   extra_info_markers: []     # substrings for informational/benign signatures

# --- Optional: additional internal ranges beyond RFC1918 (rare) ---
# extra_lan_nets: []
